name: Android Build APK (MAUI)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  TFM: "net9.0-android"
  OUTPUT_DIR: "artifacts/android"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find MAUI project
        id: find_proj
        run: |
          # Шукаємо саме Android проєкт (зазвичай містить OutputType Exe або UseMaui)
          CSPROJ=$(grep -rl "UseMaui" . --include="*.csproj" --exclude-dir=obj | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "MAUI project not found"
            exit 1
          fi
          echo "Found: $CSPROJ"
          echo "project_path=${CSPROJ}" >> $GITHUB_OUTPUT

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # 🚀 Обов'язково для .NET 9 MAUI

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: |
          dotnet workload install maui-android --skip-sign-check
          dotnet workload restore "${{ steps.find_proj.outputs.project_path }}"

      - name: Restore
        run: |
          dotnet restore "${{ steps.find_proj.outputs.project_path }}" \
            -p:EnableWindowsTargeting=true

      - name: Build APK
        run: |
          dotnet publish "${{ steps.find_proj.outputs.project_path }}" \
            -c Release \
            -f ${{ env.TFM }} \
            -p:AndroidPackageFormats=apk \
            -p:AndroidUseAapt2=true \
            -p:AndroidCreatePackagePerAbi=false \
            -p:EnableWindowsTargeting=true \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidLinkMode=Full \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            --no-restore

      - name: Collect APK
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          # 🚀 Додано виключення папки artifacts, щоб уникнути зациклення
          find . -name "*.apk" ! -path "*/obj/*" ! -path "*/artifacts/*" -exec cp {} ${{ env.OUTPUT_DIR }}/ \;
          echo "=== APK files ==="
          ls -lh ${{ env.OUTPUT_DIR }}
          COUNT=$(ls ${{ env.OUTPUT_DIR }}/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No APK generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maui-android-apk
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error