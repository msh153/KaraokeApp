name: Build .NET MAUI Android APK

on:
  push:
    branches:
      - main  # or your primary branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout code from GitHub
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up .NET SDK
    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'  # Use your required .NET version

    # Install required Android SDK dependencies
    - name: Install Android SDK dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk wget unzip

        # Download the latest command line tools from Android SDK
        wget https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip
        
        # Unzip and move the tools to the correct directory
        unzip commandlinetools-linux-7302050_latest.zip
        sudo mkdir -p /usr/local/android-sdk/cmdline-tools
        sudo mv cmdline-tools /usr/local/android-sdk/cmdline-tools/latest

        # Set the ANDROID_HOME environment variable
        echo "ANDROID_HOME=/usr/local/android-sdk" >> $GITHUB_ENV
        echo "PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$PATH" >> $GITHUB_ENV
        
        # Accept Android SDK licenses
        sdkmanager --licenses

        # Install required Android SDK components
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    # Restore dependencies and build APK
    - name: Build APK
      run: |
        dotnet restore
        dotnet build -f net8.0-android -c Release
        dotnet publish -f net8.0-android -c Release -o ./publish
        
    # Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KaraokeApp-APK
        path: ./publish/*.apk